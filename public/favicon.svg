    <path d="M7 45 C4 47 1 45 3 42 C4 40 6 42 7 43" stroke="#D1C4E9" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="3" cy="42" r="1.5" fill="#E8EAF6" />

    <!-- Main Body & Head (Solid Purple) -->
    <path d="M22 10 
             C12 10 7 17 7 26 
             C7 31 9 35 11 38 
             C10 41 9 46 10 49 
             C11 52 14 54 18 54 
             C23 54 26 53 28 50 
             C30 53 34 54 39 54 
             C44 54 47 52 48 49 
             C49 46 47 43 45 40 
             C49 35 52 28 51 20 
             C50 14 46 10 40 10 
             C36 10 32 12 30 14 
             C27 11 25 10 22 10 Z" 
          fill="#66497F" />

    <!-- Raised Trunk extending up & out -->
    <path d="M46 22 
             C52 20 54 14 53 9 
             C52 5 48 6 49 9 
             C50 12 47 15 42 17 
             C40 18 38 18 37 19" 
          stroke="#66497F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Yellow Flame / Sparkle at trunk tip -->
