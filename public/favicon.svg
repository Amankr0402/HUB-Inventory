             C52 1.5 54 0 55 0 
             C56 0 58 1.5 58 3 
             C58 4.5 56 6 55 6 
             C54 6 52 4.5 52 3 Z" 
          fill="#F7B832" />
    <circle cx="55" cy="3" r="1.8" fill="#FDE047" />

    <!-- Cute Ear -->
    <path d="M23 15 
             C15 15 11 20 11 27 
             C11 34 16 38 23 38 
             C27 38 30 35 31 32 
             C31 29 28 27 27 25 
             C26 23 27 21 28 19 
             C27 16 25 15 23 15 Z" 
          fill="#7E5C9A" />

    <!-- Eye -->
    <ellipse cx="38" cy="18" rx="2.2" ry="2.6" fill="#FFFFFF" />
    <circle cx="38.6" cy="17.8" r="1.3" fill="#21152B" />
    <circle cx="39.2" cy="17.2" r="0.5" fill="#FFFFFF" />

    <!-- Foot / Toe details -->
    <path d="M14 52 C15 50 17 50 18 52" stroke="#84669F" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M35 52 C36 50 38 50 39 52" stroke="#84669F" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M42 52 C43 50 45 50 46 52" stroke="#84669F" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>
</svg>